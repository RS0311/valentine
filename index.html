<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Clarrel 💖</title>

  <style>
    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      font-family: Arial, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #ffd6e8, #fff0f6);
      text-align: center;
    }

    h1 {
      color: #ff4d88;
      font-size: 28px;
      padding: 0 20px;
    }

    button {
      font-size: 18px;
      padding: 15px 25px;
      margin: 10px;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      transition: transform 0.2s;
    }

    #yesBtn {
      background-color: #ff4d88;
      color: white;
    }

    #noBtn {
      background-color: #888;
      color: white;
      position: fixed;
      left: 50%;
      top: 60%;
      transform: translate(-50%, -50%);
      transition: all 0.25s ease; /* smooth slide */
    }

    #message {
      font-size: 30px;
      color: #ff1a66;
      margin-top: 30px;
      display: none;
    }

    .confetti {
      position: absolute;
      width: 8px;
      height: 8px;
      animation: fall 3s linear forwards;
    }

    @keyframes fall {
      to {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }
  </style>
</head>

<body>

  <h1>Meow Will You Be My Valentine? 💘</h1>

  <button id="yesBtn">Yes 💖</button>
  <button id="noBtn">No 😢</button>

  <div id="message">Kiss him 😘💋</div>

<script>
  const noBtn = document.getElementById("noBtn");
  const yesBtn = document.getElementById("yesBtn");
  const message = document.getElementById("message");

  let yesScale = 1;

  function moveAway(clientX, clientY) {
    const rect = noBtn.getBoundingClientRect();

    const btnCenterX = rect.left + rect.width / 2;
    const btnCenterY = rect.top + rect.height / 2;

    // direction away from cursor
    let dx = btnCenterX - clientX;
    let dy = btnCenterY - clientY;

    const distance = Math.sqrt(dx * dx + dy * dy) || 1;

    dx /= distance;
    dy /= distance;

    const moveDistance = 120; // how far it slides

    let newX = rect.left + dx * moveDistance;
    let newY = rect.top + dy * moveDistance;

    // keep inside screen
    const maxX = window.innerWidth - rect.width - 10;
    const maxY = window.innerHeight - rect.height - 10;

    newX = Math.max(10, Math.min(newX, maxX));
    newY = Math.max(10, Math.min(newY, maxY));

    noBtn.style.left = newX + "px";
    noBtn.style.top = newY + "px";
    noBtn.style.transform = "none";

    // grow Yes button
    yesScale += 0.1;
    yesBtn.style.transform = "scale(" + yesScale + ")";
  }

  // Desktop hover
  document.addEventListener("mousemove", (e) => {
    const rect = noBtn.getBoundingClientRect();

    const isNear =
      e.clientX > rect.left - 50 &&
      e.clientX < rect.right + 50 &&
      e.clientY > rect.top - 50 &&
      e.clientY < rect.bottom + 50;

    if (isNear) {
      moveAway(e.clientX, e.clientY);
    }
  });

  // Mobile tap
  noBtn.addEventListener("touchstart", function(e) {
    const touch = e.touches[0];
    moveAway(touch.clientX, touch.clientY);
  });

  yesBtn.addEventListener("click", function() {
    message.style.display = "block";
    launchConfetti();
  });

  function launchConfetti() {
    for (let i = 0; i < 120; i++) {
      const confetti = document.createElement("div");
      confetti.classList.add("confetti");
      confetti.style.left = Math.random() * window.innerWidth + "px";
      confetti.style.top = "-10px";
      confetti.style.backgroundColor =
        "hsl(" + Math.random() * 360 + ", 100%, 70%)";

      document.body.appendChild(confetti);

      setTimeout(() => confetti.remove(), 3000);
    }
  }
</script>

</body>
</html>
